<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЕНТ Тренажёр | Ойындар мен Quiz — Физика және Тарих</title>
<style>
:root{
  --bg:#0f1226; --bg2:#161a37; --card:#1d2247; --card2:#262c5a;
  --accent:#6c8cff; --accent2:#a06bff; --ok:#3ddc97; --bad:#ff6b81;
  --warn:#ffcf5c; --txt:#eef1ff; --muted:#9aa3d0; --line:#2c3367;
  --phys:#6c8cff; --hist:#ffb05c;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  background:radial-gradient(1200px 600px at 70% -10%,#23295c 0%,var(--bg) 55%);
  color:var(--txt);min-height:100vh;padding:0 0 90px;
}
.wrap{max-width:920px;margin:0 auto;padding:0 16px}
header.top{
  position:sticky;top:0;z-index:30;backdrop-filter:blur(8px);
  background:linear-gradient(180deg,rgba(15,18,38,.92),rgba(15,18,38,.6));
  border-bottom:1px solid var(--line);
}
.top-inner{max-width:920px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 16px}
.brand{font-weight:800;font-size:18px;letter-spacing:.3px}
.brand span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:0}
.top-spacer{flex:1}
.lang-toggle{display:flex;gap:4px;padding:3px;background:var(--card);border:1px solid var(--line);border-radius:40px}
.lang-btn{background:none;border:none;color:var(--muted);font-weight:700;font-size:12px;padding:6px 11px;border-radius:30px;cursor:pointer}
.lang-btn.active{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff}
.ghost{
  background:var(--card);border:1px solid var(--line);color:var(--txt);
  padding:8px 12px;border-radius:11px;font-size:13px;cursor:pointer;font-weight:600;
}
.ghost:hover{background:var(--card2)}
a.ghost{text-decoration:none;display:inline-block}

h1.page{font-size:24px;margin:22px 0 4px;font-weight:800}
.sub{color:var(--muted);font-size:14px;margin-bottom:18px;line-height:1.5}
.crumbs{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px;margin:18px 0 10px;flex-wrap:wrap}
.crumbs b{color:var(--txt)}
.crumbs .c-btn{cursor:pointer;color:var(--accent);font-weight:600}
.crumbs .c-btn:hover{text-decoration:underline}

.grid{display:grid;gap:14px}
.grid.two{grid-template-columns:1fr 1fr}
.grid.auto{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
@media(max-width:560px){.grid.two{grid-template-columns:1fr}}

.tile{
  background:linear-gradient(160deg,var(--card),var(--bg2));
  border:1px solid var(--line);border-radius:18px;padding:20px;cursor:pointer;
  transition:.15s transform,.15s border-color,.15s box-shadow;position:relative;overflow:hidden;
}
.tile:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 10px 30px -12px rgba(108,140,255,.5)}
.tile .ic{font-size:30px;margin-bottom:8px}
.tile h3{font-size:18px;margin-bottom:4px}
.tile p{color:var(--muted);font-size:13px;line-height:1.45}
.tile.phys{border-left:4px solid var(--phys)}
.tile.hist{border-left:4px solid var(--hist)}
.tile .count{position:absolute;top:14px;right:16px;font-size:12px;color:var(--muted);
  background:rgba(255,255,255,.05);padding:3px 9px;border-radius:20px}
.tile.disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none!important;border-color:var(--line)!important}

.pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700;letter-spacing:.3px}
.pill.formula{background:rgba(108,140,255,.18);color:#aebcff}
.pill.date{background:rgba(255,176,92,.18);color:#ffce9a}
.pill.name{background:rgba(160,107,255,.18);color:#c9aaff}
.pill.term{background:rgba(61,220,151,.16);color:#92f0c6}

.game-head{display:flex;align-items:center;gap:12px;margin:6px 0 16px;flex-wrap:wrap}
.game-head h2{font-size:20px}
.progressbar{height:8px;background:var(--card);border-radius:20px;overflow:hidden;margin:4px 0 18px}
.progressbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:.3s}
.stat{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.stat b{color:var(--txt)}
.stat .g{color:var(--ok)} .stat .r{color:var(--bad)}

.flashwrap{perspective:1400px;margin:10px 0}
.flashcard{position:relative;width:100%;min-height:300px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;border:1px solid var(--line)}
.face.front{background:linear-gradient(160deg,var(--card2),var(--bg2))}
.face.back{background:linear-gradient(160deg,#23306b,#1a1f44);transform:rotateY(180deg)}
.face .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.face .main{font-size:26px;font-weight:700;line-height:1.35}
.face .formula-txt{font-family:'Cambria Math','Times New Roman',serif;font-size:30px}
.face .app{margin-top:14px;font-size:14px;color:var(--muted);max-width:480px;line-height:1.5}
.face .hint{position:absolute;bottom:14px;font-size:12px;color:var(--muted)}
.face .tag{position:absolute;top:14px;left:16px}
.controls{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:center}
.btn{border:none;border-radius:13px;padding:13px 20px;font-size:15px;font-weight:700;cursor:pointer;transition:.12s;flex:1;min-width:120px}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff}
.btn.good{background:var(--ok);color:#04321f}
.btn.bad{background:var(--bad);color:#3a0410}
.btn.neutral{background:var(--card2);color:var(--txt);border:1px solid var(--line)}

.match-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match-item{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;cursor:pointer;font-size:14px;line-height:1.35;transition:.12s;min-height:56px;display:flex;align-items:center}
.match-item.formula-txt{font-family:'Cambria Math',serif;font-size:17px}
.match-item:hover{border-color:var(--accent)}
.match-item.sel{border-color:var(--accent);background:var(--card2);box-shadow:0 0 0 2px var(--accent) inset}
.match-item.ok{border-color:var(--ok);background:rgba(61,220,151,.12);color:var(--ok);cursor:default;pointer-events:none;opacity:.55}
.match-item.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.q-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:8px}
.q-text{font-size:18px;font-weight:600;line-height:1.45;margin-bottom:18px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:14px 16px;font-size:15px;cursor:pointer;transition:.12s;color:var(--txt);line-height:1.4}
.opt.formula-txt{font-family:'Cambria Math',serif;font-size:17px}
.opt:hover{border-color:var(--accent);background:var(--card2)}
.opt.correct{border-color:var(--ok);background:rgba(61,220,151,.15);color:#bff5dc}
.opt.wrong{border-color:var(--bad);background:rgba(255,107,129,.13);color:#ffc1cb}
.opt:disabled{cursor:default}

.typein-q{font-size:20px;font-weight:600;line-height:1.5;margin:10px 0 18px;text-align:center}
.typein-box{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.typein-box input{background:var(--bg2);border:1px solid var(--line);border-radius:13px;color:var(--txt);padding:14px 18px;font-size:20px;width:180px;text-align:center;font-weight:700}
.typein-box input:focus{outline:none;border-color:var(--accent)}
.feedback{text-align:center;margin-top:16px;font-size:16px;font-weight:600;min-height:24px}
.feedback.ok{color:var(--ok)} .feedback.bad{color:var(--bad)}

.result{text-align:center;padding:30px 16px}
.result .big{font-size:54px;font-weight:800;margin:6px 0}
.result .ring{font-size:60px}
.result p{color:var(--muted);margin:8px 0 20px}
.review{text-align:left;margin-top:22px}
.review h4{margin-bottom:10px;font-size:15px;color:var(--muted)}
.review .row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:14px}
.review .row .ev{color:var(--muted)} .review .row .an{color:var(--ok);font-weight:700}

footer.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:36px;line-height:1.6}
.formula-txt{font-family:'Cambria Math','Times New Roman',serif}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">ЕНТ <span>Тренажёр</span><small id="brandSub"></small></div>
    <div class="top-spacer"></div>
    <div class="lang-toggle">
      <button class="lang-btn" id="lng-kk" onclick="setLang('kk')">ҚАЗ</button>

/* ===================== СОСТОЯНИЕ ===================== */
let S={subject:null,topic:null};
let VIEW='home';
const app=document.getElementById('app');

function isFormula(it){return it.cat==='formula'}
function fclass(it){return isFormula(it)?'formula-txt':''}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function buildDeck(){
  const subj=DATA[S.subject];let deck=[];
  const add=k=>subj.topics[k].items.forEach(it=>deck.push({...it,_topic:subj.topics[k].name}));
  if(S.topic==='all'){for(const k in subj.topics)add(k);}else add(S.topic);
  return deck;
}
function subjectPool(cat){const subj=DATA[S.subject];let p=[];for(const k in subj.topics)subj.topics[k].items.forEach(it=>{if(it.cat===cat)p.push(it)});return p;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function applyChrome(){
  document.documentElement.lang=LANG;
  document.getElementById('brandSub').textContent=t('brandSub');
  document.getElementById('lnkBook').textContent=t('book');
  document.getElementById('foot1').textContent=t('foot1');
  document.getElementById('foot2').textContent=t('foot2');
  document.getElementById('lng-kk').classList.toggle('active',LANG==='kk');
  document.getElementById('lng-ru').classList.toggle('active',LANG==='ru');
}
function setLang(l){LANG=l;localStorage.setItem('glang',l);applyChrome();route();}
function route(){ if(VIEW==='home')goHome(); else if(VIEW==='topics')goTopics(); else goGames(); }

function crumbs(){
  let h='<div class="crumbs"><span class="c-btn" onclick="goHome()">'+t('crumbHome')+'</span>';
  if(S.subject)h+=' › <span class="c-btn" onclick="goTopics()"><b>'+esc(L(DATA[S.subject].name))+'</b></span>';
  if(S.topic){const nm=S.topic==='all'?t('allTopics'):L(DATA[S.subject].topics[S.topic].name);h+=' › <b>'+esc(nm)+'</b>';}
  return h+'</div>';
}

/* ----- ЭКРАН 1 ----- */
function goHome(){
  VIEW='home';S={subject:null,topic:null};
  let cards='';
  for(const sk in DATA){const d=DATA[sk];let n=0;for(const tp in d.topics)n+=d.topics[tp].items.length;
    cards+=`<div class="tile ${d.color}" onclick="pickSubject('${sk}')">
      <span class="count">${n} ${t('cards')}</span><div class="ic">${d.icon}</div>
      <h3>${esc(L(d.name))}</h3><p>${sk==='phys'?t('physDesc'):t('histDesc')}</p></div>`;}
  app.innerHTML=`<h1 class="page">${t('homeTitle')}</h1><p class="sub">${t('homeSub')}</p><div class="grid two">${cards}</div>`;
  scrollTo(0,0);
}
function pickSubject(sk){S.subject=sk;S.topic=null;goTopics();}

/* ----- ЭКРАН 2 ----- */
function goTopics(){
  VIEW='topics';S.topic=null;const d=DATA[S.subject];let tiles='',total=0;
  for(const tk in d.topics){const tp=d.topics[tk];total+=tp.items.length;
    tiles+=`<div class="tile ${d.color}" onclick="pickTopic('${tk}')"><span class="count">${tp.items.length}</span>
      <h3>${esc(L(tp.name))}</h3><p>${topicSummary(tp)}</p></div>`;}
  app.innerHTML=crumbs()+`<h1 class="page">${d.icon} ${esc(L(d.name))}</h1><p class="sub">${t('topicsSub')}</p>
   <div class="tile ${d.color}" style="margin-bottom:14px" onclick="pickTopic('all')"><span class="count">${total}</span>
     <div class="ic">🔁</div><h3>${t('allTitle')}</h3><p>${t('allDesc')}</p></div>
   <div class="grid auto">${tiles}</div>`;
  scrollTo(0,0);
}
function topicSummary(tp){const c={};tp.items.forEach(it=>c[it.cat]=(c[it.cat]||0)+1);
  return Object.keys(c).map(k=>c[k]+' '+t('cat')[k]).join(' · ');}
function pickTopic(tk){S.topic=tk;goGames();}

/* ----- ЭКРАН 3 ----- */
function goGames(){
  VIEW='games';const deck=buildDeck();const hasDates=deck.some(i=>i.cat==='date');
  const tname=S.topic==='all'?t('allTopics'):L(DATA[S.subject].topics[S.topic].name);
  const games=[
    {id:'flash',ic:'🃏',n:t('flashN'),p:t('flashP'),ok:true},
    {id:'match',ic:'🧩',n:t('matchN'),p:t('matchP'),ok:deck.length>=4},
    {id:'quiz',ic:'❓',n:t('quizN'),p:t('quizP'),ok:deck.length>=4},
    {id:'type',ic:'⌨️',n:t('typeN'),p:t('typeP'),ok:hasDates},
  ];
  app.innerHTML=crumbs()+`<h1 class="page">🎮 ${esc(tname)}</h1><p class="sub">${t('gamesIntro')(deck.length)}</p>
   <div class="grid two">${games.map(g=>`<div class="tile ${DATA[S.subject].color} ${g.ok?'':'disabled'}" ${g.ok?`onclick="startGame('${g.id}')"`:''}>
     <div class="ic">${g.ic}</div><h3>${g.n}</h3><p>${g.p}</p>${g.ok?'':'<p style="color:var(--bad);margin-top:6px">'+t('unavail')+'</p>'}</div>`).join('')}</div>`;
  scrollTo(0,0);
}
function startGame(id){({flash:flashStart,match:matchStart,quiz:quizStart,type:typeStart}[id])();}
function gameHeader(title){return crumbs()+`<div class="game-head"><h2>${title}</h2><div class="top-spacer"></div>
  <button class="ghost" onclick="goGames()">${t('otherGame')}</button></div>`;}

/* ===================== ИГРА 1 — КАРТОЧКИ ===================== */
let FS;
function flashStart(){FS={queue:shuffle(buildDeck()),known:0,review:0,total:0,cur:null};FS.total=FS.queue.length;flashNext();}
function flashNext(){if(!FS.queue.length)return flashDone();FS.cur=FS.queue[0];flashRender();}
function flashRender(){
  const it=FS.cur,done=FS.total-FS.queue.length,pct=Math.round(done/FS.total*100);
  app.innerHTML=gameHeader('🃏 '+t('flashN'))+
   `<div class="stat" style="margin-bottom:6px"><span>${t('left')}: <b>${FS.queue.length}</b></span>
     <span class="g">${t('know')}: <b>${FS.known}</b></span><span class="r">${t('repeat')}: <b>${FS.review}</b></span></div>
    <div class="progressbar"><i style="width:${pct}%"></i></div>
    <div class="flashwrap"><div class="flashcard" id="fcard" onclick="flashFlip()">
      <div class="face front"><span class="tag pill ${it.cat}">${t('cat')[it.cat]}</span>
        <div class="lab">${esc(L(it._topic))}</div><div class="main">${esc(L(it.f))}</div>
        <div class="hint">${t('flipHint')}</div></div>
      <div class="face back"><span class="tag pill ${it.cat}">${t('answerLbl')}</span>
        <div class="main ${fclass(it)}">${esc(L(it.b))}</div>
        ${it.app?`<div class="app">💡 ${esc(L(it.app))}</div>`:''}<div class="hint">${t('recalled')}</div></div>
    </div></div>
    <div class="controls"><button class="btn bad" onclick="flashMark(false)">${t('btnRepeat')}</button>
      <button class="btn neutral" onclick="flashFlip()">${t('btnFlip')}</button>
      <button class="btn good" onclick="flashMark(true)">${t('btnKnow')}</button></div>`;
  scrollTo(0,0);
}
function flashFlip(){document.getElementById('fcard').classList.toggle('flip');}
function flashMark(known){FS.queue.shift();if(known)FS.known++;else{FS.review++;FS.queue.push(FS.cur);}flashNext();}
function flashDone(){app.innerHTML=gameHeader('🃏 '+t('flashN'))+`<div class="result"><div class="ring">🎉</div>
  <div class="big">${FS.total}</div><p>${t('flashDone')}</p>
  <div class="controls" style="max-width:420px;margin:0 auto"><button class="btn primary" onclick="flashStart()">${t('again')}</button>
  <button class="btn neutral" onclick="goGames()">${t('anotherGame')}</button></div></div>`;}

/* ===================== ИГРА 2 — НАЙДИ ПАРУ ===================== */
let MS;
function matchStart(){const deck=shuffle(buildDeck()).slice(0,6);
  MS={pairs:deck,left:shuffle(deck.map((d,i)=>({i,it:d}))),right:shuffle(deck.map((d,i)=>({i,it:d}))),sel:null,matched:0,tries:0,t0:Date.now()};
  matchRender();}
function matchRender(){
  const cl=it=>`class="match-item ${isFormula(it)?'formula-txt':''}"`;
  app.innerHTML=gameHeader('🧩 '+t('matchN'))+
   `<p class="sub">${t('matchInstr')}<b id="mtries">0</b></p>
    <div class="match-cols"><div id="mleft">${MS.left.map(o=>`<div data-i="${o.i}" ${cl(o.it)} onclick="matchPick('L',${o.i})">${esc(L(o.it.f))}</div>`).join('')}</div>
    <div id="mright">${MS.right.map(o=>`<div data-i="${o.i}" ${cl(o.it)} onclick="matchPick('R',${o.i})">${esc(L(o.it.b))}</div>`).join('')}</div></div>`;
  scrollTo(0,0);
}
function matchEl(side,i){return document.querySelector('#m'+(side==='L'?'left':'right')+' [data-i="'+i+'"]');}
function matchPick(side,i){
  const el=matchEl(side,i);if(el.classList.contains('ok'))return;
  if(!MS.sel){MS.sel={side,i,el};el.classList.add('sel');return;}
  if(MS.sel.side===side){MS.sel.el.classList.remove('sel');MS.sel={side,i,el};el.classList.add('sel');return;}
  MS.tries++;document.getElementById('mtries').textContent=MS.tries;
  if(MS.sel.i===i){MS.sel.el.classList.remove('sel');MS.sel.el.classList.add('ok');el.classList.add('ok');MS.sel=null;MS.matched++;
    if(MS.matched===MS.pairs.length)setTimeout(matchDone,300);}
  else{const a=MS.sel.el,b=el;a.classList.add('shake');b.classList.add('shake','sel');
    setTimeout(()=>{a.classList.remove('sel','shake');b.classList.remove('sel','shake');},380);MS.sel=null;}
}
function matchDone(){const sec=((Date.now()-MS.t0)/1000).toFixed(1);
  app.innerHTML=gameHeader('🧩 '+t('matchN'))+`<div class="result"><div class="ring">⚡</div><div class="big">${sec}с</div>
   <p>${t('matchDone')(MS.tries)}</p><div class="controls" style="max-width:420px;margin:0 auto">
   <button class="btn primary" onclick="matchStart()">${t('newSet')}</button>
   <button class="btn neutral" onclick="goGames()">${t('anotherGame')}</button></div></div>`;}

/* ===================== ИГРА 3 — QUIZ ===================== */
let QS;
function quizStart(){
  const deck=shuffle(buildDeck());const qs=[];
  for(const it of deck){
    const pool=subjectPool(it.cat).filter(x=>L(x.b)!==L(it.b));
    if(pool.length<3)continue;
    const opts=shuffle([L(it.b),...shuffle(pool).slice(0,3).map(x=>L(x.b))]);
    qs.push({it,opts,ans:L(it.b)});
    if(qs.length>=12)break;
  }
  QS={qs,idx:0,score:0,wrong:[]};quizRender();
}
function quizRender(){
  const q=QS.qs[QS.idx],pct=Math.round(QS.idx/QS.qs.length*100);
  app.innerHTML=gameHeader('❓ Quiz')+
   `<div class="stat" style="margin-bottom:6px"><span>${t('qWord')} <b>${QS.idx+1}/${QS.qs.length}</b></span>
     <span class="g">${t('correctW')}: <b>${QS.score}</b></span></div>
    <div class="progressbar"><i style="width:${pct}%"></i></div>
    <div class="q-card"><span class="pill ${q.it.cat}">${esc(L(q.it._topic))}</span>
     <div class="q-text" style="margin-top:12px">${t('qpref')[q.it.cat]}<br><b>${esc(L(q.it.f))}</b></div>
     <div class="opts" id="qopts">${q.opts.map((o,k)=>`<button class="opt ${q.it.cat==='formula'?'formula-txt':''}" data-k="${k}" onclick="quizAns(${k})">${esc(o)}</button>`).join('')}</div></div>`;
  scrollTo(0,0);
}
function quizAns(k){
  const q=QS.qs[QS.idx],chosen=q.opts[k];
  document.querySelectorAll('#qopts .opt').forEach(b=>{b.disabled=true;if(b.textContent===q.ans)b.classList.add('correct');});
  if(chosen===q.ans)QS.score++;else{document.querySelector('#qopts [data-k="'+k+'"]').classList.add('wrong');QS.wrong.push(q);}
  setTimeout(()=>{QS.idx++;QS.idx>=QS.qs.length?quizDone():quizRender();},900);
}
function quizDone(){
  const n=QS.qs.length,s=QS.score,pct=Math.round(s/n*100);
  const ring=pct>=80?'🏆':pct>=50?'👍':'📒';const msg=pct>=80?t('quizHi'):pct>=50?t('quizMid'):t('quizLow');
  let review='';
  if(QS.wrong.length)review='<div class="review"><h4>'+t('mistakes')+'</h4>'+QS.wrong.map(q=>
    `<div class="row"><span class="ev">${esc(L(q.it.f))}</span> → <span class="an">${esc(q.ans)}</span></div>`).join('')+'</div>';
  app.innerHTML=gameHeader('❓ Quiz')+`<div class="result"><div class="ring">${ring}</div><div class="big">${s}/${n}</div><p>${msg}</p>
   <div class="controls" style="max-width:420px;margin:0 auto"><button class="btn primary" onclick="quizStart()">${t('again')}</button>
   <button class="btn neutral" onclick="goGames()">${t('anotherGame')}</button></div>${review}</div>`;
}

/* ===================== ИГРА 4 — ВПИШИ ГОД ===================== */
let TS;
function typeStart(){TS={qs:shuffle(buildDeck().filter(i=>i.cat==='date')),idx:0,score:0,wrong:[]};typeRender();}
function typeRender(){
  const q=TS.qs[TS.idx],pct=Math.round(TS.idx/TS.qs.length*100);
  app.innerHTML=gameHeader('⌨️ '+t('typeN'))+
   `<div class="stat" style="margin-bottom:6px"><span>${t('qWord')} <b>${TS.idx+1}/${TS.qs.length}</b></span>
     <span class="g">${t('correctW')}: <b>${TS.score}</b></span></div>
    <div class="progressbar"><i style="width:${pct}%"></i></div>
    <div class="q-card"><span class="pill date">${esc(L(q._topic))}</span>
     <div class="typein-q">${esc(L(q.f))}</div>
     <div class="typein-box"><input id="tin" inputmode="numeric" placeholder="${t('yearPh')}" autocomplete="off" onkeydown="if(event.key==='Enter')typeCheck()">
       <button class="btn primary" style="flex:0 0 auto;min-width:120px" onclick="typeCheck()">${t('checkBtn')}</button></div>
     <div class="feedback" id="tfb"></div></div>`;
  setTimeout(()=>{const i=document.getElementById('tin');if(i)i.focus();},50);scrollTo(0,0);
}
function typeCheck(){
  const q=TS.qs[TS.idx],inp=document.getElementById('tin');if(inp.disabled)return;
  const fb=document.getElementById('tfb');inp.disabled=true;
  const got=(inp.value.match(/\d{3,4}/)||[''])[0];
  const nums=(L(q.b).match(/\d{3,4}/g)||[]);
  const ok=got&&nums.includes(got);
  if(ok){TS.score++;fb.className='feedback ok';fb.textContent=t('correctEx')+L(q.b);inp.style.borderColor='var(--ok)';}
  else{fb.className='feedback bad';fb.innerHTML=t('rightAns')+'<b>'+esc(L(q.b))+'</b>';inp.style.borderColor='var(--bad)';TS.wrong.push(q);}
  setTimeout(()=>{TS.idx++;TS.idx>=TS.qs.length?typeDone():typeRender();},1300);
}
function typeDone(){
  const n=TS.qs.length,s=TS.score,pct=Math.round(s/n*100);const ring=pct>=80?'🏆':pct>=50?'👍':'📒';
  let review='';
  if(TS.wrong.length)review='<div class="review"><h4>'+t('repeatDates')+'</h4>'+TS.wrong.map(q=>
    `<div class="row"><span class="ev">${esc(L(q.f))}</span> → <span class="an">${esc(L(q.b))}</span></div>`).join('')+'</div>';
  app.innerHTML=gameHeader('⌨️ '+t('typeN'))+`<div class="result"><div class="ring">${ring}</div><div class="big">${s}/${n}</div>
   <p>${pct>=80?t('typeHi'):t('typeLow')}</p><div class="controls" style="max-width:420px;margin:0 auto">
   <button class="btn primary" onclick="typeStart()">${t('again')}</button>
   <button class="btn neutral" onclick="goGames()">${t('anotherGame')}</button></div>${review}</div>`;
}

applyChrome();
goHome();
</script>
</body>
</html>
